# .sandbox/project.conf — fo
PROJECT_NAME=fo

# Build system (make or mage)
BUILD_SYSTEM=make

# Single fleet pin for golangci-lint. CI, the Makefile, and the sandbox all
# read this key — there is exactly one place this version is written
# (conform lint-pin rule).
GOLANGCI_LINT_VERSION=v2.12.2

# No FO_VERSION pin here: this IS the fo repo. `make check` never pipes
# through a fo binary (only `make audit` does, and it uses the freshly built
# ./fo); CI builds fo from source via `go build`. Pinning fo against itself
# would gate HEAD behind its own previous release.
